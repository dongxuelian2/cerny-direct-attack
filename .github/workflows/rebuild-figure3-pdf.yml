name: Temporary Figure 3 PDF rebuild
on:
  push:
    branches:
      - editorial/figure3-clarify-20261109
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/figure3
      - name: Commit rebuilt PDF
        run: |
          git add papers/figure3/main.pdf
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild Figure 3 PDF from revised LaTeX"
            git push
          fi
