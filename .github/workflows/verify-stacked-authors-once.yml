name: Verify stacked-author paper format
on:
  push:
    branches:
      - codex/problem4-manuscript-final-edit-20261028
permissions:
  contents: write
jobs:
  latex:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript with bibliography
        uses: xu-cheng/latex-action@v4
        with:
          root_file: papers/problem4/main.tex
          work_in_root_file_dir: true
      - name: Verify author stack and render first page
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          test -s papers/problem4/main.pdf
          pdftotext -f 1 -l 1 -layout papers/problem4/main.pdf /tmp/first-page.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/first-page.txt').read_text()
          names=['Qichao Wang','Hebei University of Technology',
                 'Daoyu Dong','University of Electronic Science and Technology of China',
                 'October 28, 2026','Abstract']
          for n in names:
              assert n in p, f'Missing first-page heading: {n}'
          assert [p.index(n) for n in names]==sorted(p.index(n) for n in names), 'Incorrect author order'
          print('First-page stacked author order verified')
          PY
          if grep -E 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Overfull \\hbox' papers/problem4/main.log; then exit 1; fi
          pdfinfo papers/problem4/main.pdf | grep -E 'Pages:|Page size:|File size:'
          pdftoppm -f 1 -l 1 -scale-to 1200 -png -singlefile papers/problem4/main.pdf papers/problem4/.author-review
      - name: Commit PDF and review image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f papers/problem4/main.pdf papers/problem4/.author-review.png
          git diff --cached --quiet || git commit -m "Rebuild paper with vertically stacked authors"
          git push origin "HEAD:$GITHUB_REF_NAME"
