name: Temporary Figure 3 final PDF rebuild
on:
  push:
    branches:
      - editorial/figure3-chronology-wording-20261110
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/figure3-chronology-wording-20261110
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: papers/figure3
      - name: Verify and commit rebuilt PDF
        shell: bash
        run: |
          test -s papers/figure3/main.pdf
          pdfinfo papers/figure3/main.pdf | grep -E 'Pages:|Page size:'
          pdftotext papers/figure3/main.pdf - | grep -F 'An exact compress-with-another threshold'
          git add papers/figure3/main.pdf
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild Figure 3 PDF from final editorial source"
            git push origin HEAD:editorial/figure3-chronology-wording-20261110
          fi
