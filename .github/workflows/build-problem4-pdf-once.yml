name: Build Problem 4 PDF once
on:
  push:
    branches:
      - codex/problem4-manuscript-final-edit-20261028
permissions:
  contents: write
jobs:
  compile-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: papers/problem4/main.tex
          work_in_root_file_dir: true
      - name: Commit compiled PDF
        shell: bash
        run: |
          test -s papers/problem4/main.pdf
          test "$(head -c4 papers/problem4/main.pdf)" = "%PDF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f papers/problem4/main.pdf
          git commit -m "Add compiled Problem 4 manuscript PDF"
          git push origin "HEAD:$GITHUB_REF_NAME"
