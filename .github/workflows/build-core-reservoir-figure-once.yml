name: Build and review finite-core Figure 2
on:
  push:
    branches:
      - codex/problem4-manuscript-final-edit-20261028
permissions:
  contents: write
jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: papers/problem4/main.tex
          work_in_root_file_dir: true
      - name: Check references and render the Figure 2 page
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          test -s papers/problem4/main.pdf
          pdftotext -layout papers/problem4/main.pdf /tmp/main.txt
          grep -F 'Nonisolated core and isolated-state reservoir' /tmp/main.txt
          grep -F 'isolated-state reservoir' /tmp/main.txt
          if grep -E 'LaTeX Warning: (There were undefined references|Citation .* undefined)|Overfull \\hbox' papers/problem4/main.log; then
            echo 'Unexpected LaTeX warning'; exit 1
          fi
          pages=$(pdfinfo papers/problem4/main.pdf | awk '/^Pages:/ {print $2}')
          found=0
          for page in $(seq 1 "$pages"); do
            if pdftotext -f "$page" -l "$page" papers/problem4/main.pdf - | grep -q 'Figure 2'; then
              pdftoppm -f "$page" -l "$page" -scale-to 1450 -png -singlefile papers/problem4/main.pdf papers/problem4/.core-figure-review
              echo "Rendered Figure 2 on page $page of $pages"
              found=1
              break
            fi
          done
          test "$found" = 1
      - name: Commit compiled paper and temporary review image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f papers/problem4/main.pdf papers/problem4/.core-figure-review.png
          git diff --cached --quiet || git commit -m "Compile revised finite-core Figure 2 manuscript"
          git push origin "HEAD:$GITHUB_REF_NAME"
